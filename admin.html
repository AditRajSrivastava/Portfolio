<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Contact Messages</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0A0A0A 0%, #1A1A1A 100%);
            color: #FFFFFF;
            line-height: 1.6;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #FF6B35, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #B3B3B3;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #FF6B35;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: #B3B3B3;
            font-size: 0.9rem;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            flex: 1;
            max-width: 400px;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: white;
            outline: none;
            width: 100%;
            margin-left: 0.5rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #FF6B35, #DC2626);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 53, 0.4);
        }

        .messages-container {
            display: grid;
            gap: 1.5rem;
        }

        .message-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .message-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.2);
            border-color: rgba(255, 107, 53, 0.3);
        }

        .message-card.unread {
            border-left: 4px solid #FFD700;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .message-info h3 {
            color: #FF6B35;
            margin-bottom: 0.25rem;
        }

        .message-meta {
            color: #B3B3B3;
            font-size: 0.9rem;
        }

        .message-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-read {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .btn-read:hover {
            background: rgba(34, 197, 94, 0.3);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .message-subject {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: #FFD700;
        }

        .message-content {
            color: #E5E5E5;
            line-height: 1.8;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            white-space: pre-wrap;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #B3B3B3;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #B3B3B3;
        }

        .empty-state i {
            font-size: 4rem;
            color: #FF6B35;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .header h1 {
                font-size: 2rem;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                max-width: 100%;
            }

            .message-header {
                flex-direction: column;
            }

            .message-actions {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-envelope-open-text"></i> Contact Messages Dashboard</h1>
            <p>Manage and view all contact form submissions</p>
        </div>

        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-number" id="total-messages">0</div>
                <div class="stat-label">Total Messages</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="unread-messages">0</div>
                <div class="stat-label">Unread Messages</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="read-messages">0</div>
                <div class="stat-label">Read Messages</div>
            </div>
        </div>

        <div class="controls">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Search messages by name, email, or subject...">
            </div>
            <button class="btn btn-primary" onclick="loadMessages()">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>

        <div id="messages-container" class="messages-container">
            <div class="loading">
                <i class="fas fa-spinner fa-spin" style="font-size: 2rem;"></i>
                <p>Loading messages...</p>
            </div>
        </div>
    </div>

    <script src="api-config.js"></script>
    <script>
        let allMessages = [];
        
        // API endpoints from config
        const API = window.API_CONFIG?.endpoints || {
            contacts: '/api/contacts',
            health: '/api/health'
        };

        // Load messages on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadMessages();
        });

        // Search functionality
        document.getElementById('search-input').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            filterMessages(searchTerm);
        });

        async function loadMessages() {
            try {
                const response = await fetch(API.contacts);
                const data = await response.json();

                if (data.success) {
                    allMessages = data.contacts;
                    updateStats();
                    displayMessages(allMessages);
                } else {
                    showError('Failed to load messages');
                }
            } catch (error) {
                console.error('Error loading messages:', error);
                showError('Error connecting to server');
            }
        }

        function updateStats() {
            const total = allMessages.length;
            const unread = allMessages.filter(m => !m.read).length;
            const read = total - unread;

            document.getElementById('total-messages').textContent = total;
            document.getElementById('unread-messages').textContent = unread;
            document.getElementById('read-messages').textContent = read;
        }

        function displayMessages(messages) {
            const container = document.getElementById('messages-container');

            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h2>No messages yet</h2>
                        <p>When someone contacts you through the portfolio, messages will appear here.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = messages.map(msg => `
                <div class="message-card ${!msg.read ? 'unread' : ''}" data-id="${msg.id}">
                    <div class="message-header">
                        <div class="message-info">
                            <h3>${escapeHtml(msg.name)}</h3>
                            <div class="message-meta">
                                <i class="fas fa-envelope"></i> ${escapeHtml(msg.email)} | 
                                <i class="fas fa-clock"></i> ${formatDate(msg.timestamp)}
                                ${!msg.read ? '<span style="color: #FFD700; margin-left: 0.5rem;"><i class="fas fa-star"></i> New</span>' : ''}
                            </div>
                        </div>
                        <div class="message-actions">
                            ${!msg.read ? `<button class="btn-sm btn-read" onclick="markAsRead('${msg.id}')">
                                <i class="fas fa-check"></i> Mark Read
                            </button>` : ''}
                            <button class="btn-sm btn-delete" onclick="deleteMessage('${msg.id}')">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>
                    </div>
                    <div class="message-subject">
                        <i class="fas fa-bookmark"></i> ${escapeHtml(msg.subject)}
                    </div>
                    <div class="message-content">${escapeHtml(msg.message)}</div>
                </div>
            `).join('');
        }

        function filterMessages(searchTerm) {
            const filtered = allMessages.filter(msg =>
                msg.name.toLowerCase().includes(searchTerm) ||
                msg.email.toLowerCase().includes(searchTerm) ||
                msg.subject.toLowerCase().includes(searchTerm) ||
                msg.message.toLowerCase().includes(searchTerm)
            );
            displayMessages(filtered);
        }

        async function markAsRead(id) {
            try {
                const baseURL = window.API_CONFIG?.baseURL || '';
                const response = await fetch(`${baseURL}/api/contacts/${id}/read`, {
                    method: 'PATCH'
                });

                const data = await response.json();

                if (data.success) {
                    // Update local data
                    const message = allMessages.find(m => m.id === id);
                    if (message) message.read = true;
                    updateStats();
                    displayMessages(allMessages);
                } else {
                    alert('Failed to mark as read');
                }
            } catch (error) {
                console.error('Error marking as read:', error);
                alert('Error connecting to server');
            }
        }

        async function deleteMessage(id) {
            if (!confirm('Are you sure you want to delete this message?')) {
                return;
            }

            try {
                const baseURL = window.API_CONFIG?.baseURL || '';
                const response = await fetch(`${baseURL}/api/contacts/${id}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    // Remove from local data
                    allMessages = allMessages.filter(m => m.id !== id);
                    updateStats();
                    displayMessages(allMessages);
                } else {
                    alert('Failed to delete message');
                }
            } catch (error) {
                console.error('Error deleting message:', error);
                alert('Error connecting to server');
            }
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);

            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins} minute${diffMins > 1 ? 's' : ''} ago`;
            if (diffHours < 24) return `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;
            if (diffDays < 7) return `${diffDays} day${diffDays > 1 ? 's' : ''} ago`;

            return date.toLocaleDateString() + ' at ' + date.toLocaleTimeString();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(message) {
            const container = document.getElementById('messages-container');
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-triangle" style="color: #ef4444;"></i>
                    <h2>Error</h2>
                    <p>${message}</p>
                    <button class="btn btn-primary" onclick="loadMessages()" style="margin-top: 1rem;">
                        <i class="fas fa-sync-alt"></i> Retry
                    </button>
                </div>
            `;
        }
    </script>
</body>
</html>
